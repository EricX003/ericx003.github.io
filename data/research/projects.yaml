# Each entry needs: bib (citation key in data/research/citations.bib), thumbnail,
# description, links. Title, authors, venue, and year come from the bib entry.
#
# Optional per-entry overrides — title, venue, year — change ONLY what the site
# displays (the copied bibtex stays verbatim from citations.bib). Use them where
# the Google Scholar export is wrong or stale (lowercased acronyms, missing
# venues, wrong years); they survive re-pasting a fresh Scholar export.
# Venue abbreviations/bolding: data/research/venues.yaml. Page order = file order.



